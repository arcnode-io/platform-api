# Appliance docker_runtime layer — gated on the wizard (started by
# arcnode-docker-runtime.path watching /etc/arcnode/.wizard-applied, see
# setup.sh), same `docker compose up -d` mechanism EC2 UserData already
# proves in cfn_resources.py. Not the commercial/defense compose files
# verbatim: those assume cloud-managed persistence (Aurora/Tiger
# Cloud/Neo4j Aura) the appliance doesn't have — this is the on-prem
# equivalent, pointed at the native daemon layer (Postgres etc.) instead.
#
# Starts with just ems-hmi (what the old one-off `docker run` unit did) —
# proving the compose migration itself first, before adding new services
# on top of it.
services:
  ems-hmi:
    image: public.ecr.aws/y1d2j6a8/ems-hmi:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /opt/arcnode/hmi-cfg.customer.yml:/opt/arcnode/hmi-cfg.customer.yml:ro
