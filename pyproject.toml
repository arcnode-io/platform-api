[project]
name = "platform-api"
version = "1.0.0-beta"
requires-python = "==3.13.2"
dependencies = [
    "aioboto3>=13.2.0",
    "asyncpg>=0.30.0",
    "classy-fastapi>=0.6.1",
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.0",
    "pydantic[email]>=2.11.7",
    "pyyaml>=6.0.2",
    "tortoise-orm[asyncpg]>=0.25.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "black>=26.3.1",
    "asyncpg-stubs>=0.29",
    "poethepoet>=0.32.0",
    "ty>=0.0.18",
    "types-pyyaml>=6.0",
    "psycopg2-binary>=2.9.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.4",
    "pip-audit>=2.6.1",
    "pytest-cov>=6.0.0",
    "deptry>=0.23.0",
    "pip>=25.1.1",
    "testcontainers[postgres,localstack]>=4.8.1",
    "cfn-lint>=1.49.3",
    "boto3-stubs[bedrock-runtime,cloudformation,lambda]>=1.35.0",
    "mypy-boto3-bedrock-runtime>=1.35.0",
    "mypy-boto3-cloudformation>=1.35.0",
    "mypy-boto3-lambda>=1.43.0",
    "paho-mqtt>=2.1.0",
    "playwright>=1.60.0",
]

[tool.poe.tasks]
dev = "python -m src.main"
depcheck = "deptry . --per-rule-ignores DEP001=cfnlint,DEP004=pytest|cfnlint,DEP002=asyncpg,DEP003=boto3 --extend-exclude 'src/cfn/persistence/lambda_code|src/compose/init-scripts'"
format = "black ."
lint = "ruff check"
typecheck = "ty check"
audit-src = "bandit -r src/* -s B101,B105,B106,B310"
audit-packages = "pip-audit"
security = ["audit-src", "audit-packages"]
checks = ["depcheck", "format", "lint", "typecheck", "security"]
unit = "pytest -vv src/*"
integration = "pytest -vv tests/*"
cover = "pytest -vv --cov=src src/*"
test = ["unit", "integration"]
review = "claude 'run code-reviewer agent against diff for quality and elegance'"
commit = "bash -c 'uv run poe checks && uv run poe test && uv run poe review && git add -A && git cz && git push'"

[tool.pytest.ini_options]
# `e2e` = real-AWS deploy + assert + teardown (~$0.10/run, ~20min).
# Excluded from the default test run so `uv run pytest` stays fast + free;
# CI e2e job selects with `-m e2e` on nightly cron + manual.
markers = [
    "e2e: real-AWS end-to-end deploy + assert + teardown",
]
addopts = "-m 'not e2e'"

[tool.coverage.run]
omit = ["*/test_*.py", "tests/*"]
