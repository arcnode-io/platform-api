# Defense / Sovereign variant — EMS stack on customer EC2.
#
# Persistence: Aurora only — document slice (device-api topology) +
# timeseries slice with pg_partman for `measurements` (live broker
# ingest, fed by telemetry-writer). Analyst stack (ercot-solar
# reference data, vector, graph) will land alongside ems-analyst-model
# when it's integrated; that service self-seeds its own domain tables
# from public S3, so platform-api just provisions Aurora.
#
# Boot order:
#   1. hivemq + mock-modbus-server start
#   2. device-api seeds topology from /opt/arcnode/dtm.json (idempotent)
#   3. telemetry-writer subscribes to MQTT, INSERTs into measurements
#   4. industrial-gateway publishes telemetry, hmi serves UI
#
# Connection URLs sourced from /opt/arcnode/secrets.env (UserData
# writes from CFN-managed Secrets Manager).

x-env-files: &env-files
  env_file:
    - /opt/arcnode/config.env
    - /opt/arcnode/secrets.env

services:
  hivemq:
    image: hivemq/hivemq-ce:latest
    restart: unless-stopped
    <<: *env-files
    ports:
      - "1883:1883"

  device-api:
    image: public.ecr.aws/y1d2j6a8/ems-device-api:latest
    restart: unless-stopped
    <<: *env-files
    environment:
      BOOT_DTM_PATH: /app/dtm.json
      ENV: beta
    volumes:
      - /opt/arcnode/dtm.json:/app/dtm.json:ro

  mock-modbus-server:
    image: public.ecr.aws/y1d2j6a8/mock-modbus-server:latest
    restart: unless-stopped

  # MQTT → Aurora bridge. HiveMQ CE doesn't ship a Postgres connector
  # (Enterprise-only, sales-gated); we own the bridge as a tiny
  # subscriber. INSERTs into the partman-managed measurements table.
  telemetry-writer:
    image: python:3.13-alpine
    restart: unless-stopped
    <<: *env-files
    volumes:
      - /opt/arcnode/init-scripts:/scripts:ro
    command:
      - sh
      - -c
      - "pip install --quiet paho-mqtt psycopg2-binary && python /scripts/telemetry_writer.py"
    depends_on:
      hivemq:
        condition: service_started

  hmi:
    image: public.ecr.aws/y1d2j6a8/ems-hmi:latest
    restart: unless-stopped
    <<: *env-files
    ports:
      - "80:80"
    depends_on:
      device-api:
        condition: service_started

  industrial-gateway:
    image: public.ecr.aws/y1d2j6a8/ems-industrial-gateway:latest
    restart: unless-stopped
    <<: *env-files
    environment:
      ENV: beta
    depends_on:
      hivemq:
        condition: service_started
      device-api:
        condition: service_started
      mock-modbus-server:
        condition: service_started

  # Phase 1 defense smoke: analyst-server hosts the agent which spawns
  # the mcp-server child. mcp-server self-seeds vector slice on first
  # boot from public S3 (graph leg lands in Phase 2 with Neptune+AOSS).
  # Exposes /chat for the end-to-end smoke. Agent calls openai
  # gpt-4o-mini + OpenWeatherMap; both keys ride secrets.env.
  analyst-server:
    image: public.ecr.aws/y1d2j6a8/ems-analyst-server:latest
    restart: unless-stopped
    <<: *env-files
    environment:
      ENV: beta
    ports:
      - "8000:8000"
