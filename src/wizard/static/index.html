<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ARCNODE — First-boot Setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  /* Same page background as the delivery portal: the browser picks the scheme,
     hairline gradient + film-grain noise for quiet depth. */
  :root { color-scheme: light dark; --bg: #080808; --accent-rgb: 74, 122, 170; }
  @media (prefers-color-scheme: light) { :root { --bg: #f5f4ef; --accent-rgb: 47, 95, 143; } }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 90% 60% at 50% -20%, rgba(var(--accent-rgb), 0.05), transparent 70%),
      url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/></svg>");
    font-family: "DM Mono", ui-monospace, monospace;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root { min-height: 100vh; }
  @keyframes wizSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes wizSweep { from { left: -35%; } to { left: 100%; } }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="/tokens.jsx"></script>
<script type="text/babel" src="/setup-wizard.jsx"></script>
<script type="text/babel" src="/preflight-page.jsx"></script>
<script type="text/babel" src="/daemon-pages.jsx"></script>
<script type="text/babel" src="/ollama-page.jsx"></script>
<script type="text/babel" src="/container-pages.jsx"></script>
<script type="text/babel" src="/https-page.jsx"></script>

<script type="text/babel">
  // The browser's colour scheme picks the theme, like the portal — no toggle.
  const LIGHT_QUERY = window.matchMedia('(prefers-color-scheme: light)');
  function App() {
    const [isLight, setIsLight] = React.useState(LIGHT_QUERY.matches);
    React.useEffect(() => {
      const onChange = (e) => setIsLight(e.matches);
      LIGHT_QUERY.addEventListener('change', onChange);
      return () => LIGHT_QUERY.removeEventListener('change', onChange);
    }, []);
    return (
      <SetupWizardBody t={isLight ? SOVEREIGN_LIGHT : SOVEREIGN} isDark={!isLight}/>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
