stages:
  - check
  - publish
  - deploy
  - e2e
  - mirror

checks:
  stage: check
  variables:
    UV_FROZEN: "true"
    # Pinned commit of edp-module-assemblies; bump when you want newer equipment.
    EDP_MODULE_ASSEMBLIES_SHA: "2cfac23"
  script:
    # One archive download: GitLab rate-limits per-file raw fetches and 429'd the shared runner.
    - uv run python tests/fixtures/edp_assets.py --sha "${EDP_MODULE_ASSEMBLIES_SHA}"
    - uv run poe checks
    - uv run pytest --junitxml=junit.xml
    - uv run poe cover
    - uv run coverage xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

shell:
  stage: check
  script:
    - docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:stable src/iso/build.sh src/iso/setup.sh src/iso/phases/*.sh src/compose/platform/refresh-secrets.sh src/compose/site-cert.sh

build:
  stage: publish
  script:
    - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
    - docker build -t public.ecr.aws/y1d2j6a8/platform-api .
    - docker push public.ecr.aws/y1d2j6a8/platform-api

build_telemetry_writer:
  # Canonical owner of public.ecr.aws/y1d2j6a8/ems-telemetry-writer.
  # Same image consumed by commercial + defense composes (this repo) AND
  # the appliance compose (platform-ems-iso). Replaces the previous
  # runtime `pip install paho-mqtt psycopg2-binary` pattern that
  # restart-loops on offline reboot — bug for airgapped appliance,
  # resilience gap for cloud variants.
  stage: publish
  script:
    - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
    - docker build -t public.ecr.aws/y1d2j6a8/ems-telemetry-writer:latest -f src/compose/images/telemetry-writer/Dockerfile .
    - docker push public.ecr.aws/y1d2j6a8/ems-telemetry-writer:latest

build_hivemq:
  # Canonical owner of public.ecr.aws/y1d2j6a8/ems-hivemq — HiveMQ CE with
  # the File RBAC extension baked + Allow-All stripped (so the broker rejects
  # anonymous and enforces per-role topic ACL). Consumed by commercial +
  # defense composes (this repo) AND the appliance compose (platform-ems-iso).
  # credentials.xml is NOT baked — bind-mounted per-deploy from Secrets Manager.
  stage: publish
  script:
    - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
    - docker build -t public.ecr.aws/y1d2j6a8/ems-hivemq:latest -f src/compose/images/hivemq/Dockerfile .
    - docker push public.ecr.aws/y1d2j6a8/ems-hivemq:latest

publish_compose:
  stage: publish
  script:
    # Per-variant docker-compose, and init
    # scripts are static artifacts EC2 UserData fetches at boot. No
    # versioning prefix — latest in main always wins. Customer EC2 caches
    # locally on first pull, so already-deployed stacks are unaffected.
    # Excludes keep platform-api Python toolchain leftovers (pycache,
    # *_test.py) out of the public bucket — those don't ship to customers.
    - aws s3 sync src/compose/commercial/    s3://arcnode-public/compose/commercial/    --delete --exclude "__pycache__/*" --exclude "*.pyc"
    - aws s3 cp src/compose/credentials.template.xml s3://arcnode-public/compose/credentials.template.xml
    - aws s3 cp src/compose/https-ingress.conf s3://arcnode-public/compose/https-ingress.conf
    - aws s3 cp src/compose/site-cert.sh s3://arcnode-public/compose/site-cert.sh
    - aws s3 sync src/compose/defense/       s3://arcnode-public/compose/defense/       --delete --exclude "__pycache__/*" --exclude "*.pyc"
    - aws s3 sync src/compose/init-scripts/  s3://arcnode-public/init-scripts/          --delete --exclude "__pycache__/*" --exclude "*.pyc" --exclude "*_test.py"
    - aws s3 sync src/compose/observability/ s3://arcnode-public/observability/         --delete
    - aws s3 sync src/compose/der_control_ingress/ s3://arcnode-public/der-control-ingress/ --delete
    # e2e/test-stack-only overlay (system_adr §25) — UserData fetches this
    # only when e2e=True, merged in via a second `docker compose -f`.
    - aws s3 sync src/compose/industrial-fixtures/ s3://arcnode-public/compose/industrial-fixtures/ --delete
    # platform.arcnode.io's own compose + Caddyfile (src/hosting/platform-stack.yaml fetches them at boot).
    - aws s3 sync src/compose/platform/          s3://arcnode-public/platform/              --delete --exclude "__pycache__/*" --exclude "*.pyc" --exclude "*_test.py"
    - aws s3 cp src/compose/industrial-fixtures.json s3://arcnode-public/seed/industrial-fixtures.json
    - aws s3 rm s3://arcnode-public/seed/dtm-smoke.json || true
  only:
    - main

publish_iso:
  # The appliance ISO: stock Debian netinst + preseed late_command hook.
  # Built in a throwaway Debian container (xorriso, no root on the runner);
  # chown hands the root-owned output back so the runner can clean it up.
  # Latest on main wins, same as the compose files.
  stage: publish
  script:
    - mkdir -p iso-out
    - docker run --rm -v "$PWD:/w" debian:trixie sh -c "apt-get update -qq && apt-get install -y -qq xorriso curl ca-certificates && /w/src/iso/build.sh /w/iso-out && chown -R $(id -u):$(id -g) /w/iso-out"
    - cd iso-out && sha256sum arcnode-ems-amd64.iso > arcnode-ems-amd64.iso.sha256
    - aws s3 cp arcnode-ems-amd64.iso s3://arcnode-public/iso/arcnode-ems-amd64.iso
    - aws s3 cp arcnode-ems-amd64.iso.sha256 s3://arcnode-public/iso/arcnode-ems-amd64.iso.sha256
  only:
    - main

deploy_platform:
  # platform.arcnode.io re-pulls its compose file and images after every push to
  # main. No SSH: the command runs through SSM on the box tagged Name=arcnode-platform
  # (src/hosting/platform-stack.yaml). Skips cleanly while the stack doesn't exist.
  stage: deploy
  variables:
    AWS_DEFAULT_REGION: us-east-1
    PLATFORM_S3: s3://arcnode-public/platform
  script:
    - |
      INSTANCE=$(aws ec2 describe-instances --filters Name=tag:Name,Values=arcnode-platform Name=instance-state-name,Values=running --query "Reservations[].Instances[].InstanceId" --output text)
      if [ -z "$INSTANCE" ]; then echo "no arcnode-platform instance yet; nothing to deploy"; exit 0; fi
      COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript --comment "platform-api ${CI_COMMIT_SHORT_SHA}" \
        --parameters "{\"commands\":[\"cd /opt/arcnode-platform && aws s3 cp ${PLATFORM_S3}/docker-compose.yaml docker-compose.yaml && aws s3 cp ${PLATFORM_S3}/Caddyfile Caddyfile && aws s3 cp ${PLATFORM_S3}/refresh-secrets.sh refresh-secrets.sh && chmod +x refresh-secrets.sh && ./refresh-secrets.sh us-east-1 && docker compose pull --quiet && docker compose up -d --remove-orphans\"]}" \
        --query Command.CommandId --output text)
      aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE"
      aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE" --query "{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}" --output json
      curl -fsS --retry 10 --retry-delay 6 --retry-all-errors https://platform.arcnode.io/
  only:
    - main

.e2e_base: &e2e_base
  stage: e2e
  # A killed or timed-out job never reaches the fixtures' teardown, which once left three
  # stacks (instances + Aurora, ~$1.50/h) running. This runs regardless and deletes whatever
  # this pipeline's tests created.
  after_script:
    # Before teardown: the stacks' events and the boxes' cloud-init logs, so a failure stays
    # diagnosable after the stacks are gone. The job log and artifacts keep them.
    - |
      for s in $(aws cloudformation describe-stacks --region us-east-1 --query "Stacks[?Tags[?Key=='arcnode-pipeline' && Value=='${CI_PIPELINE_ID}']].StackName" --output text); do
        echo "===== events: $s"
        aws cloudformation describe-stack-events --region us-east-1 --stack-name "$s" --query "StackEvents[?contains(ResourceStatus,'FAILED') || contains(ResourceStatus,'ROLLBACK')].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" --output text | tee -a e2e-stack-events.log || true
        aws s3 cp "s3://arcnode-artifacts/diagnostic/$s/cloud-init.log" "e2e-cloud-init-$s.log" 2>/dev/null || true
        aws cloudformation delete-stack --region us-east-1 --stack-name "$s"
      done
  artifacts:
    when: always
    paths:
      - e2e-run.log
      - e2e-stack-events.log
      - e2e-cloud-init-*.log
    reports:
      junit: junit-e2e.xml

e2e_commercial:
  # Real-AWS e2e — deploys the commercial stack (Tiger Cloud + S3) with
  # the industrial-fixtures DTM, asserts gateway → MQTT → telemetry-writer
  # → Tiger persistence, tears down. Catches CFN/UserData/VPC/IAM bugs
  # the unit + integration suites can't. ~$0.10/run, ~20min wall clock.
  #
  # AURA_CONNECTION_STRING + TIGERDATA_CONNECTION_STRING must be set in
  # project CI/CD variables (masked + protected). AWS creds come from the
  # runner's role (same as publish_compose).
  <<: *e2e_base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'   # cron
    - if: '$CI_PIPELINE_SOURCE == "web"'         # manual "Run pipeline" UI
    - if: '$CI_PIPELINE_SOURCE == "api"'         # glab ci run
  script:
    # Browser e2e (test_hmi_browser.py) drives a real Chromium.
    - uv run playwright install --with-deps chromium
    # pyproject default addopts = "-m 'not e2e'" → must opt-in explicitly. All
    # three share the session-scoped commercial_stack (one deploy): DB-level
    # persistence + analyst (test_commercial), broker-auth chain
    # (test_broker_auth), browser login→live-SLD (test_hmi_browser).
    - uv run pytest -m e2e
      tests/e2e/test_commercial.py
      tests/e2e/test_broker_auth.py
      tests/e2e/test_hmi_browser.py
      -v -s --log-cli-level=INFO --junitxml=junit-e2e.xml 2>&1 | tee e2e-run.log
  # commercial_stack is session-scoped (one stack across both tests).
  # Budget: 25 min CFN create + 10 min /health + (2 × ~5 min test work) +
  # ~10 min teardown ≈ 55 min. 90 min for AWS-flake headroom.
  # Three stacks one after another, ~25-30 min each plus tests: 90 min was not enough.
  timeout: 150 minutes

e2e_defense:
  # Real-AWS e2e — deploys the defense stack (Aurora + Neptune + AOSS)
  # with the industrial-fixtures DTM. Same gateway → MQTT → writer →
  # persistence chain, validated against the sovereign cloud topology.
  # Costlier than commercial (Neptune + AOSS) → manual on API triggers,
  # auto on schedule + web (human-intent pipelines).
  <<: *e2e_base
  variables:
    # File-level skipif in tests/e2e/test_defense.py looks at this env;
    # job-level variables set it for the runner shell.
    RUN_DEFENSE_E2E: "1"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
      when: manual
      allow_failure: true   # api-triggered pipelines succeed without playing defense
  script:
    # Browser parity checks (hmi_checks) drive a real Chromium.
    - uv run playwright install --with-deps chromium
    - uv run pytest -m e2e tests/e2e/test_defense.py -v --junitxml=junit-e2e.xml
  # Defense create ~30 min + health + 10 tests incl. two Chromium runs.
  timeout: 60 minutes

mirror:
  stage: mirror
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - git checkout -B main
    - git push --mirror git@github.com:arcnode-io/platform-api.git
  only:
    - main
