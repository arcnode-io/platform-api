# TLS terminator + mutual-TLS gate for the utility/aggregator-facing IEEE
# 2030.5 DERControl intake. der-control-api itself stays internal-only, plain
# HTTP, no cert code — this is the only publicly reachable path to it.
#
# ssl_verify_client on rejects any client whose cert doesn't chain to the
# mounted truststore before the request ever reaches der-control-api. The
# verified cert is forwarded as a header so der-control-api can derive the
# 2030.5 LFDI/SFDI device identity (SHA-256 hash of the DER-encoded cert)
# itself — that computation belongs in application code, not nginx.
#
# $ssl_client_escaped_cert, not the deprecated $ssl_client_cert: the old
# variable is multi-line PEM, which is invalid in an HTTP/2 header field
# (no raw newlines allowed) and was never really valid as a proxied header
# in HTTP/1.1 either. Escaped is single-line, URL-encoded PEM — decode
# before parsing as X.509.
#
# resolver + variable proxy_pass: a restarting der-control-api shouldn't take
# the gateway down with it (same pattern as the HMI ingress).
server {
  listen 8443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/tls/cert.pem;
  ssl_certificate_key /etc/nginx/tls/key.pem;
  ssl_client_certificate /etc/nginx/tls/truststore.pem;
  ssl_verify_client on;

  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    set $upstream http://der-control-api:8080;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
    proxy_read_timeout 60s;
  }
}
