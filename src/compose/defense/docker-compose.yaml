# Defense / Sovereign variant — EMS stack on customer EC2.
#
# Persistence: Aurora only — document slice (device-api topology) +
# timeseries slice with pg_partman for `measurements` (live broker
# ingest, fed by telemetry-writer). Analyst stack (ercot-solar
# reference data, vector, graph) will land alongside ems-analyst-model
# when it's integrated; that service self-seeds its own domain tables
# from public S3, so platform-api just provisions Aurora.
#
# Boot order:
#   1. hivemq + mock-modbus-server start
#   2. device-api seeds topology from /opt/arcnode/dtm.json (idempotent)
#   3. telemetry-writer subscribes to MQTT, INSERTs into measurements
#   4. industrial-gateway publishes telemetry, hmi serves UI
#
# Connection URLs sourced from /opt/arcnode/secrets.env (UserData
# writes from CFN-managed Secrets Manager).

x-env-files: &env-files
  env_file:
    - /opt/arcnode/config.env
    - /opt/arcnode/secrets.env

services:
  hivemq:
    # Custom CE image: File RBAC baked, Allow-All stripped — rejects anonymous,
    # enforces per-role topic ACL (gateway/operator/viewer). credentials.xml
    # (per-deploy machine pws) written by UserData from Secrets Manager.
    image: public.ecr.aws/y1d2j6a8/ems-hivemq:latest
    restart: unless-stopped
    <<: *env-files
    volumes:
      - /opt/arcnode/credentials.xml:/opt/hivemq/extensions/hivemq-file-rbac-extension/conf/credentials.xml:ro
    ports:
      - "1883:1883"

  device-api:
    image: public.ecr.aws/y1d2j6a8/ems-device-api:latest
    restart: unless-stopped
    <<: *env-files
    environment:
      BOOT_DTM_PATH: /app/dtm.json
      ENV: beta
    volumes:
      - /opt/arcnode/dtm.json:/app/dtm.json:ro

  # IEEE 2030.5 / OpenADR DER control intake. Utility/aggregator POSTs
  # DERControl events → persist to its own Aurora slice (DER_CONTROL_URL,
  # ddl-auto=update) → republish setpoints as measurement samples on the
  # der_dispatch singleton device. Broker identity arcnode_der_control_api
  # (MQTT_DER_CONTROL_API_PASSWORD, both in secrets.env). Internal-only,
  # no published port — der-control-ingress (below) is the only path in.
  der-control-api:
    image: public.ecr.aws/y1d2j6a8/ems-der-control-api:latest
    restart: unless-stopped
    <<: *env-files
    environment:
      ENV: beta
    depends_on:
      hivemq:
        condition: service_started

  # Mutual-TLS terminator for der-control-api — IEEE 2030.5 mandates client
  # certs (device identity is a hash of the cert, LFDI/SFDI), so this can't
  # be plain HTTPS. Rejects any client without a cert signed by the mounted
  # truststore before der-control-api ever sees the request. Doesn't touch
  # HMI's :80 path — dedicated gateway, one concern. See
  # src/compose/der_control_ingress/nginx.conf for the mTLS config; cert/key
  # generated at boot, truststore is an ops-populated Secrets Manager
  # placeholder (per-DERMS-integration CA bundle — not wired into customer
  # order intake yet, that's a separate decision).
  der-control-ingress:
    image: nginx:1.27-alpine
    restart: unless-stopped
    <<: *env-files
    ports:
      - "8443:8443"
    volumes:
      - /opt/arcnode/der-control-tls/cert.pem:/etc/nginx/tls/cert.pem:ro
      - /opt/arcnode/der-control-tls/key.pem:/etc/nginx/tls/key.pem:ro
      - /opt/arcnode/der-control-truststore.pem:/etc/nginx/tls/truststore.pem:ro
      - /opt/arcnode/der-control-ingress.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      der-control-api:
        condition: service_started

  # Industrial-fixtures mocks — full set covers every protocol the
  # smoke DTM (industrial-fixtures.json) references. Bindings point
  # at these compose service names; gateway connects on the standard
  # protocol ports. See ems-industrial-fixtures repo for the impls.
  mock-modbus-server:
    image: public.ecr.aws/y1d2j6a8/mock-modbus-server:latest
    restart: unless-stopped

  mock-snmp-agent:
    image: public.ecr.aws/y1d2j6a8/mock-snmp-agent:latest
    restart: unless-stopped

  mock-redfish-service:
    image: public.ecr.aws/y1d2j6a8/mock-redfish-service:latest
    restart: unless-stopped

  mock-dnp3-outstation:
    image: public.ecr.aws/y1d2j6a8/mock-dnp3-outstation:latest
    restart: unless-stopped

  mock-bacnet-device:
    image: public.ecr.aws/y1d2j6a8/mock-bacnet-device:latest
    restart: unless-stopped

  # MQTT → Aurora bridge. HiveMQ CE doesn't ship a Postgres connector
  # (Enterprise-only, sales-gated); we own the bridge as a tiny
  # subscriber. INSERTs into the partman-managed measurements table.
  #
  # Image bakes paho-mqtt + psycopg2-binary preinstalled (see
  # src/compose/images/telemetry-writer/Dockerfile). No runtime pip
  # install → restart-clean on instance reboot, no resilience tax on
  # transient pypi outages.
  telemetry-writer:
    image: public.ecr.aws/y1d2j6a8/ems-telemetry-writer:latest
    restart: unless-stopped
    <<: *env-files
    depends_on:
      hivemq:
        condition: service_started

  hmi:
    image: public.ecr.aws/y1d2j6a8/ems-hmi:latest
    restart: unless-stopped
    <<: *env-files
    ports:
      - "80:80"
    volumes:
      # nginx serves this at /cfg.customer.yml (alias); the SPA fetches it at
      # boot for siteId + same-origin URIs. Written by UserData.
      - /opt/arcnode/hmi-cfg.customer.yml:/opt/arcnode/hmi-cfg.customer.yml:ro
    depends_on:
      device-api:
        condition: service_started

  industrial-gateway:
    image: public.ecr.aws/y1d2j6a8/ems-industrial-gateway:latest
    restart: unless-stopped
    <<: *env-files
    environment:
      ENV: beta
      CFG_CUSTOMER_PATH: /app/cfg.customer.yml
    volumes:
      - /opt/arcnode/gateway-cfg.customer.yml:/app/cfg.customer.yml:ro
    depends_on:
      hivemq:
        condition: service_started
      device-api:
        condition: service_started
      mock-modbus-server:
        condition: service_started
      mock-snmp-agent:
        condition: service_started
      mock-redfish-service:
        condition: service_started
      mock-dnp3-outstation:
        condition: service_started
      mock-bacnet-device:
        condition: service_started

  # Phase 1 defense smoke: analyst-server hosts the agent which spawns
  # the mcp-server child. mcp-server self-seeds vector slice on first
  # boot from public S3 (graph leg lands in Phase 2 with Neptune+AOSS).
  # Exposes /chat for the end-to-end smoke. Agent calls openai
  # gpt-4o-mini + OpenWeatherMap; both keys ride secrets.env.
  analyst-server:
    image: public.ecr.aws/y1d2j6a8/ems-analyst-server:latest
    restart: unless-stopped
    <<: *env-files
    environment:
      ENV: beta
      # ems-analyst-agent's loader merges this YAML over the baked
      # cfg.defaults.yml at startup (see ems-analyst-agent/config.py).
      # UserData writes the file with the customer's market values.
      CFG_CUSTOMER_PATH: /app/cfg.customer.yml
    volumes:
      - /opt/arcnode/analyst-cfg.customer.yml:/app/cfg.customer.yml:ro
    ports:
      - "8000:8000"

  # Observability + ML tracking — same set as commercial. Defense gets
  # them too so behavior matches across deployment shapes. Customer can
  # ignore if they have their own observability stack.
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    <<: *env-files
    volumes:
      - /opt/arcnode/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/arcnode/observability/prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    <<: *env-files
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-arcnode}
    volumes:
      - /opt/arcnode/observability/grafana-data:/var/lib/grafana
      - /opt/arcnode/observability/grafana-provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    restart: unless-stopped
    <<: *env-files
    volumes:
      - /opt/arcnode/mlflow/mlflow-data:/mlflow/mlruns
      - /opt/arcnode/mlflow/mlflow-artifacts:/mlflow/artifacts
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlruns/mlflow.db
      --default-artifact-root file:///mlflow/artifacts
      --host 0.0.0.0 --port 5000
