# Commercial variant — EMS stack on customer EC2.
#
# Persistence: Aurora (document) + Tiger Cloud (timeseries) + Neo4j Aura
# (graph). Connection URLs sourced from /opt/arcnode/secrets.env (written
# by EC2 UserData from CFN-managed Secrets Manager entries).
#
# Vector + graph + ercot seeding lives in the consumers (mcp-server pkg
# loaded by analyst-server; analyst-model directly). Don't re-add init
# containers here — see consumer seed.py.
#
# All images: public.ecr.aws/y1d2j6a8/<service>:latest (anonymous pull
# from customer's EC2; arcnode publishes to ECR Public on release).

x-env-files: &env-files
  env_file:
    - /opt/arcnode/config.env
    - /opt/arcnode/secrets.env

services:
  hivemq:
    image: hivemq/hivemq-ce:latest
    restart: unless-stopped
    <<: *env-files
    # HiveMQ CE ships with the Allow All Extension out of the box, so
    # anonymous publish/subscribe just works. When real auth lands, drop
    # the Allow All extension and bring up an auth extension instead.

  device-api:
    image: public.ecr.aws/y1d2j6a8/ems-device-api:latest
    restart: unless-stopped
    <<: *env-files
    environment:
      BOOT_DTM_PATH: /app/dtm.json
      ENV: beta
    volumes:
      - /opt/arcnode/dtm.json:/app/dtm.json:ro

  # MQTT → Tiger Cloud bridge. HiveMQ CE doesn't ship a Postgres connector
  # (Enterprise-only, sales-gated); we own the bridge as a tiny subscriber
  # instead. Same `INSERT INTO measurements ...` SQL as defense.
  telemetry-writer:
    image: python:3.13-alpine
    restart: unless-stopped
    <<: *env-files
    volumes:
      - /opt/arcnode/init-scripts:/scripts:ro
    command:
      - sh
      - -c
      - "pip install --quiet paho-mqtt psycopg2-binary && python /scripts/telemetry_writer.py"
    depends_on:
      hivemq:
        condition: service_started

  # Industrial-fixtures mocks — full set covers every protocol the
  # smoke DTM (industrial-fixtures.json) references. Bindings point
  # at these compose service names; gateway connects on the standard
  # protocol ports. See ems-industrial-fixtures repo for the impls.
  mock-modbus-server:
    image: public.ecr.aws/y1d2j6a8/mock-modbus-server:latest
    restart: unless-stopped

  mock-snmp-agent:
    image: public.ecr.aws/y1d2j6a8/mock-snmp-agent:latest
    restart: unless-stopped

  mock-redfish-service:
    image: public.ecr.aws/y1d2j6a8/mock-redfish-service:latest
    restart: unless-stopped

  mock-dnp3-outstation:
    image: public.ecr.aws/y1d2j6a8/mock-dnp3-outstation:latest
    restart: unless-stopped

  mock-bacnet-device:
    image: public.ecr.aws/y1d2j6a8/mock-bacnet-device:latest
    restart: unless-stopped

  industrial-gateway:
    image: public.ecr.aws/y1d2j6a8/ems-industrial-gateway:latest
    restart: unless-stopped
    <<: *env-files
    environment:
      ENV: beta
      # gateway loader reads CFG_CUSTOMER_PATH at boot and merges over
      # cfg.defaults.yml — UserData writes site_id into this file.
      CFG_CUSTOMER_PATH: /app/cfg.customer.yml
    volumes:
      - /opt/arcnode/gateway-cfg.customer.yml:/app/cfg.customer.yml:ro
    depends_on:
      hivemq:
        condition: service_started
      mock-modbus-server:
        condition: service_started
      mock-snmp-agent:
        condition: service_started
      mock-redfish-service:
        condition: service_started
      mock-dnp3-outstation:
        condition: service_started
      mock-bacnet-device:
        condition: service_started

  hmi:
    image: public.ecr.aws/y1d2j6a8/ems-hmi:latest
    restart: unless-stopped
    <<: *env-files
    ports:
      - "80:80"
    depends_on:
      device-api:
        condition: service_started

  analyst-server:
    image: public.ecr.aws/y1d2j6a8/ems-analyst-server:latest
    restart: unless-stopped
    <<: *env-files
    environment:
      ENV: beta
      # ems-analyst-agent's loader merges this YAML over the baked
      # cfg.defaults.yml at startup (see ems-analyst-agent/config.py).
      # UserData writes the file with the customer's market values.
      CFG_CUSTOMER_PATH: /app/cfg.customer.yml
    volumes:
      - /opt/arcnode/analyst-cfg.customer.yml:/app/cfg.customer.yml:ro
    ports:
      - "8000:8000"

  analyst-model:
    image: public.ecr.aws/y1d2j6a8/ems-analyst-model:latest
    restart: unless-stopped
    <<: *env-files

  # Observability + ML tracking — added across cloud + ISO so every
  # deployment ships with the same on-box telemetry surface. Cloud
  # customers usually have their own observability stack and can ignore;
  # the cost is one container each, internal-only ports.
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    <<: *env-files
    volumes:
      - /opt/arcnode/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/arcnode/observability/prometheus-data:/prometheus
    # Port 9090 NOT exposed — accessed via grafana proxy / kubectl-style
    # port-forward when an operator needs raw queries.

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    <<: *env-files
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-arcnode}
    volumes:
      - /opt/arcnode/observability/grafana-data:/var/lib/grafana
      - /opt/arcnode/observability/grafana-provisioning:/etc/grafana/provisioning:ro
    # Port 3000 NOT exposed publicly — operator port-forwards or HMI proxies.
    depends_on:
      prometheus:
        condition: service_started

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    restart: unless-stopped
    <<: *env-files
    volumes:
      - /opt/arcnode/mlflow/mlflow-data:/mlflow/mlruns
      - /opt/arcnode/mlflow/mlflow-artifacts:/mlflow/artifacts
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlruns/mlflow.db
      --default-artifact-root file:///mlflow/artifacts
      --host 0.0.0.0 --port 5000
    # Port 5000 NOT exposed publicly — analyst-model logs to mlflow:5000
    # over the compose network only.
