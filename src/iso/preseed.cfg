# DEV-LOOP SCAFFOLDING ONLY — none of the full-preseed automation below
# (locale/partitioning/account auto-answers) ships in a customer order's
# ISO. It exists purely so reinstalling this one dedicated dev box doesn't
# need babysitting. The real per-order build (dtm.json baked in, no login
# required) is separate, future work — don't carry these defaults into it
# without re-deriving them for that actual flow.
#
# late_command is the one piece that's a real rehearsal of the product
# mechanism (auto-provisioning before first boot); everything else here is
# just removing click-through for this machine specifically.
#
# Reason: every reinstall wipes this machine's entire internal disk via
# guided/atomic partitioning below. That's the intended behavior for this
# dedicated dev-iteration box, not an accident.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string arcnode-dev
d-i netcfg/get_domain string unassigned-domain

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean true

# Guided, use entire disk, all files in one partition — simplest recipe,
# no LVM/encryption yet.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# No root password set -> installer gives the first user sudo instead.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string joe
d-i passwd/username string joe
d-i passwd/user-password password j03
d-i passwd/user-password-again password j03
# Reason: j03 is a throwaway dev-iteration password, not a real secret —
# installer would otherwise refuse it as too weak.
d-i user-setup/allow-password-weak boolean true

tasksel tasksel/first multiselect standard
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

d-i finish-install/reboot_in_progress note

# This is deliberately NOT where real provisioning (Docker, EMS stack, LLM
# models) belongs on its own — late_command runs in the installer's own
# constrained environment with no guaranteed robust networking. It's the
# trigger: prove the automated install pipeline can stand up real running
# services with zero manual steps, end to end. The actual provisioning
# logic lives in setup.sh (this directory), fetched from the install media
# and run inside the target chroot. Moved out of an inline one-liner once
# that one-liner stopped scaling (three levels of nested shell quoting,
# multiple new daemons/phases still to come — see README.md's roadmap).
#
# cp runs in the installer's own (non-chrooted) environment, where /cdrom
# is mounted — this exact `cp /cdrom/X /target/Y` then `in-target` pattern
# is the documented, standard way to get a file from the install media
# onto the target and execute it there. wizard-src (the setup wizard's
# FastAPI+JSX source) copies the same way, into /opt/arcnode-wizard-src —
# setup.sh (now inside the chroot) runs it natively.
#
# No `> logfile` redirect out here — it belongs inside setup.sh itself
# (see its own header comment for why: a redirect on this line would be
# resolved by the live installer environment, not the chroot, and never
# survive to the installed system).
d-i preseed/late_command string cp /cdrom/setup.sh /target/root/setup.sh && cp -r /cdrom/phases /target/root/arcnode-phases && cp -r /cdrom/wizard-src /target/opt/arcnode-wizard-src && in-target sh /root/setup.sh
