# Defense / Sovereign variant — EMS stack on customer EC2.
#
# SMOKE-LEAN-SEED: scoped to the ercot-solar-timeseries seed-into-Aurora
# verification. Broker leg (hivemq, device-api, mock-modbus-server,
# telemetry-writer, industrial-gateway, hmi) is commented out — restore
# alongside the broker-leg verification next pass. Analyst stack
# (Neptune + AOSS + analyst-server / analyst-model + their seed init
# containers) also remains commented in the matching CFN persistence
# build.
#
# Persistence at the moment: Aurora only — document slice + timeseries
# slice with pg_partman. The init container below restores the ERCOT
# solar dump into the timeseries slice (analyst-API training data).
#
# Connection URLs sourced from /opt/arcnode/secrets.env (UserData writes
# from CFN-managed Secrets Manager).

x-env-files: &env-files
  env_file:
    - /opt/arcnode/config.env
    - /opt/arcnode/secrets.env

services:
  # Restore the ERCOT solar timeseries dump into Aurora. Init container —
  # exits 0 once seeded; idempotent across compose restarts via the
  # arcnode_seed_markers row.
  seed-ercot-solar-timeseries:
    image: alpine:3.20
    restart: "no"
    <<: *env-files
    volumes:
      - /opt/arcnode/init-scripts:/scripts:ro
    command: ["sh", "/scripts/seed-ercot-solar-timeseries-plain.sh"]

