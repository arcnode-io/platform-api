# Commercial variant — EMS stack on customer EC2.
#
# Persistence: Aurora (document + vector) + Tiger Cloud (timeseries) +
# Neo4j Aura (graph). Connection URLs sourced from /opt/arcnode/secrets.env
# (written by EC2 UserData from CFN-managed Secrets Manager entries).
#
# Boot order:
#   1. seed-* init containers run in parallel
#   2. After all inits exit 0, long-running services start (gated by
#      depends_on.<init>.condition: service_completed_successfully)
#   3. telemetry-writer subscribes to MQTT and INSERTs into TIMESERIES_URL
#      (Tiger Cloud) — HiveMQ CE has no built-in DB connector; we own the
#      bridge as a sidecar.
#
# All images: public.ecr.aws/y1d2j6a8/<service>:latest (anonymous pull from
# customer's EC2; arcnode publishes to ECR Public on release).

x-env-files: &env-files
  env_file:
    - /opt/arcnode/config.env
    - /opt/arcnode/secrets.env

services:
  # ─── init containers ─────────────────────────────────────
  seed-vector:
    image: alpine:3.20
    restart: "no"
    <<: *env-files
    volumes:
      - /opt/arcnode/init-scripts:/scripts:ro
    command: ["sh", "/scripts/seed-vector.sh"]

  seed-ercot-solar:
    image: alpine:3.20
    restart: "no"
    <<: *env-files
    volumes:
      - /opt/arcnode/init-scripts:/scripts:ro
    command: ["sh", "/scripts/seed-ercot-solar.sh"]

  seed-graph:
    image: python:3.13-alpine
    restart: "no"
    <<: *env-files
    volumes:
      - /opt/arcnode/init-scripts:/scripts:ro
    # pip install before invoking — keeps the script free of subprocess
    # bootstrap shenanigans + clean top-of-file imports.
    command:
      - sh
      - -c
      - "pip install --quiet neo4j && python /scripts/seed-graph-neo4j.py"

  # ─── long-running services ───────────────────────────────
  hivemq:
    image: hivemq/hivemq-ce:latest
    restart: unless-stopped
    <<: *env-files
    # HiveMQ CE ships with the Allow All Extension out of the box, so
    # anonymous publish/subscribe just works. When real auth lands, drop
    # the Allow All extension and bring up an auth extension instead.
    # 1883 MQTT — internal-only, no host port mapping (no auth per design)

  device-api:
    image: public.ecr.aws/y1d2j6a8/ems-device-api:latest
    restart: unless-stopped
    <<: *env-files
    environment:
      BOOT_DTM_PATH: /app/dtm.json
      # ENV=beta picks up cfg.yml's beta block (mqttBrokerUrl: mqtt://hivemq:1883
      # + container-internal hostnames). Without it device-api defaults to
      # local cfg and tries to connect to 127.0.0.1:1883.
      ENV: beta
    volumes:
      - /opt/arcnode/dtm.json:/app/dtm.json:ro
    # device-api only consumes DOCUMENT_URL — vector/graph belong to the
    # analyst stack, not here. Aurora itself is up by the time compose
    # runs (CFN's ems_instance_depends_on gates the EC2 on the bootstrap
    # custom resource), so no init-container gate needed.

  # MQTT → Tiger Cloud bridge. HiveMQ CE doesn't ship a Postgres connector
  # (Enterprise-only, sales-gated); we own the bridge as a tiny subscriber
  # instead. Same `INSERT INTO measurements ...` SQL as defense.
  telemetry-writer:
    image: python:3.13-alpine
    restart: unless-stopped
    <<: *env-files
    volumes:
      - /opt/arcnode/init-scripts:/scripts:ro
    command:
      - sh
      - -c
      - "pip install --quiet paho-mqtt psycopg2-binary && python /scripts/telemetry_writer.py"
    depends_on:
      hivemq:
        condition: service_started

  industrial-gateway:
    image: public.ecr.aws/y1d2j6a8/ems-industrial-gateway:latest
    restart: unless-stopped
    <<: *env-files
    depends_on:
      hivemq:
        condition: service_started

  hmi:
    image: public.ecr.aws/y1d2j6a8/ems-hmi:latest
    restart: unless-stopped
    <<: *env-files
    # Nginx in the image listens on 80 (per Dockerfile EXPOSE 80 + default
    # nginx.conf). The EmsSecurityGroup also opens 80 inbound from 0.0.0.0/0.
    ports:
      - "80:80"
    depends_on:
      device-api:
        condition: service_started

  analyst-server:
    image: public.ecr.aws/y1d2j6a8/ems-analyst-server:latest
    restart: unless-stopped
    <<: *env-files
    depends_on:
      seed-ercot-solar:
        condition: service_completed_successfully
      seed-vector:
        condition: service_completed_successfully
      seed-graph:
        condition: service_completed_successfully

  analyst-model:
    image: public.ecr.aws/y1d2j6a8/ems-analyst-model:latest
    restart: unless-stopped
    <<: *env-files
    depends_on:
      seed-ercot-solar:
        condition: service_completed_successfully
