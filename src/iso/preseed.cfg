# DEV-LOOP SCAFFOLDING ONLY — none of the full-preseed automation below
# (locale/partitioning/account auto-answers) ships in a customer order's
# ISO. It exists purely so reinstalling this one dedicated dev box doesn't
# need babysitting. The real per-order build (dtm.json baked in, no login
# required) is separate, future work — don't carry these defaults into it
# without re-deriving them for that actual flow.
#
# late_command is the one piece that's a real rehearsal of the product
# mechanism (auto-provisioning before first boot); everything else here is
# just removing click-through for this machine specifically.
#
# Reason: every reinstall wipes this machine's entire internal disk via
# guided/atomic partitioning below. That's the intended behavior for this
# dedicated dev-iteration box, not an accident.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string arcnode-dev
d-i netcfg/get_domain string unassigned-domain

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean true

# Guided, use entire disk, all files in one partition — simplest recipe,
# no LVM/encryption yet.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# No root password set -> installer gives the first user sudo instead.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string joe
d-i passwd/username string joe
d-i passwd/user-password password j03
d-i passwd/user-password-again password j03
# Reason: j03 is a throwaway dev-iteration password, not a real secret —
# installer would otherwise refuse it as too weak.
d-i user-setup/allow-password-weak boolean true

tasksel tasksel/first multiselect standard
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

d-i finish-install/reboot_in_progress note

# This is deliberately NOT where real provisioning (Docker, EMS stack, LLM
# models) belongs — late_command runs in the installer's own constrained
# environment with no guaranteed robust networking. It's the thing under
# test: prove the automated install pipeline can stand up a real running
# service with zero manual steps, end to end.
#
# Docker is the priority item — it has no prerequisite among env
# vars/secrets/other daemons (those depend on containers that need Docker
# to exist, not the reverse), so its full GPG->repo->install->enable
# sequence runs first.
#
# Docker install mirrors ~/engineering-with-ai/tooling-playbooks/main.yml's
# proven shared Docker block verbatim (GPG key -> apt repo -> docker-ce
# stack incl. docker-compose-plugin) rather than Debian's own docker.io,
# which has no compose plugin available at all in trixie's repos (confirmed
# via packages.debian.org — "No such package").
#
# arcnode-nginx-docker.service replaces the native-nginx regression check —
# nginx now runs AS a docker container (proving Docker/Compose actually
# work, not just that they're installed), same external proof shape (curl
# -> 200) so it's a clean swap. Next step: same unit, image swapped from
# nginx to the real ems-hmi image. Can't pre-pull the image during
# late_command (daemon isn't live in the install-time chroot, same reason
# `docker run` can't happen there either) — first real boot pulls it over
# the network before port 80 answers, so give it a beat after reboot.
# ExecStartPre removes any stale same-named container from a prior run;
# ExecStart runs un-detached (no -d) so systemd tracks it as the service's
# real main process, the correct systemd+docker idiom.
#
# arcnode-dummy.service is still kept as a second, independent proof of
# "set up once via late_command, enabled every boot via systemd" — distinct
# from arcnode-nginx-docker.service's own use of that same mechanism.
#
# Reason: curl/figlet need no `apt-get update` (base install's package
# lists already cover them — confirmed empirically), but Docker's repo is
# brand new to apt, so IT does need one. That means the dead `deb cdrom:`
# entry (still active at this point in the install — see the
# walking-skeleton README) would break it like before; the sed strips it
# first, right before the one update call that actually needs it.
d-i preseed/late_command string in-target sh -c '{ apt-get install -y curl figlet && sed -i "/^deb cdrom:/s/^/#/" /etc/apt/sources.list && install -m 0755 -d /etc/apt/keyrings && curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc && chmod a+r /etc/apt/keyrings/docker.asc && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list && apt-get update && apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin && systemctl enable docker && figlet "ArcNode EMS" > /etc/motd && printf "[Unit]\nDescription=arcnode nginx (docker)\nAfter=docker.service network-online.target\nRequires=docker.service\nWants=network-online.target\n\n[Service]\nRestart=always\nExecStartPre=-/usr/bin/docker rm -f arcnode-nginx\nExecStart=/usr/bin/docker run --name arcnode-nginx -p 80:80 nginx\nExecStop=/usr/bin/docker stop arcnode-nginx\n\n[Install]\nWantedBy=multi-user.target\n" > /etc/systemd/system/arcnode-nginx-docker.service && systemctl enable arcnode-nginx-docker.service && printf "[Unit]\nDescription=arcnode dummy placeholder daemon\n\n[Service]\nExecStart=/usr/bin/sleep infinity\nRestart=always\n\n[Install]\nWantedBy=multi-user.target\n" > /etc/systemd/system/arcnode-dummy.service && systemctl enable arcnode-dummy.service; } > /var/log/arcnode-late-command.log 2>&1'
