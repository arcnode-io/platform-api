stages:
  - check
  - publish
  - e2e
  - mirror

checks:
  stage: check
  variables:
    UV_FROZEN: "true"
  script:
    - uv run poe checks
    - uv run pytest --junitxml=junit.xml
    - uv run poe cover
    - uv run coverage xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
build:
  stage: publish
  script:
    - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
    - docker build -t public.ecr.aws/y1d2j6a8/platform-api .
    - docker push public.ecr.aws/y1d2j6a8/platform-api

build_telemetry_writer:
  # Canonical owner of public.ecr.aws/y1d2j6a8/ems-telemetry-writer.
  # Same image consumed by commercial + defense composes (this repo) AND
  # the appliance compose (platform-ems-iso). Replaces the previous
  # runtime `pip install paho-mqtt psycopg2-binary` pattern that
  # restart-loops on offline reboot — bug for airgapped appliance,
  # resilience gap for cloud variants.
  stage: publish
  script:
    - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
    - docker build -t public.ecr.aws/y1d2j6a8/ems-telemetry-writer:latest -f src/compose/images/telemetry-writer/Dockerfile .
    - docker push public.ecr.aws/y1d2j6a8/ems-telemetry-writer:latest

build_hivemq:
  # Canonical owner of public.ecr.aws/y1d2j6a8/ems-hivemq — HiveMQ CE with
  # the File RBAC extension baked + Allow-All stripped (so the broker rejects
  # anonymous and enforces per-role topic ACL). Consumed by commercial +
  # defense composes (this repo) AND the appliance compose (platform-ems-iso).
  # credentials.xml is NOT baked — bind-mounted per-deploy from Secrets Manager.
  stage: publish
  script:
    - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
    - docker build -t public.ecr.aws/y1d2j6a8/ems-hivemq:latest -f src/compose/images/hivemq/Dockerfile .
    - docker push public.ecr.aws/y1d2j6a8/ems-hivemq:latest

publish_compose:
  stage: publish
  script:
    # Per-variant docker-compose, and init
    # scripts are static artifacts EC2 UserData fetches at boot. No
    # versioning prefix — latest in main always wins. Customer EC2 caches
    # locally on first pull, so already-deployed stacks are unaffected.
    # Excludes keep platform-api Python toolchain leftovers (pycache,
    # *_test.py) out of the public bucket — those don't ship to customers.
    - aws s3 sync src/compose/commercial/    s3://arcnode-public/compose/commercial/    --delete --exclude "__pycache__/*" --exclude "*.pyc"
    - aws s3 sync src/compose/defense/       s3://arcnode-public/compose/defense/       --delete --exclude "__pycache__/*" --exclude "*.pyc"
    - aws s3 sync src/compose/init-scripts/  s3://arcnode-public/init-scripts/          --delete --exclude "__pycache__/*" --exclude "*.pyc" --exclude "*_test.py"
    - aws s3 sync src/compose/observability/ s3://arcnode-public/observability/         --delete
    - aws s3 cp src/compose/industrial-fixtures.json s3://arcnode-public/seed/industrial-fixtures.json
    - aws s3 rm s3://arcnode-public/seed/dtm-smoke.json || true
  only:
    - main

.e2e_base: &e2e_base
  stage: e2e
  artifacts:
    when: always
    reports:
      junit: junit-e2e.xml

e2e_commercial:
  # Real-AWS e2e — deploys the commercial stack (Tiger Cloud + S3) with
  # the industrial-fixtures DTM, asserts gateway → MQTT → telemetry-writer
  # → Tiger persistence, tears down. Catches CFN/UserData/VPC/IAM bugs
  # the unit + integration suites can't. ~$0.10/run, ~20min wall clock.
  #
  # AURA_CONNECTION_STRING + TIGERDATA_CONNECTION_STRING must be set in
  # project CI/CD variables (masked + protected). AWS creds come from the
  # runner's role (same as publish_compose).
  <<: *e2e_base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'   # cron
    - if: '$CI_PIPELINE_SOURCE == "web"'         # manual "Run pipeline" UI
    - if: '$CI_PIPELINE_SOURCE == "api"'         # glab ci run
  script:
    # Browser e2e (test_hmi_browser.py) drives a real Chromium.
    - uv run playwright install --with-deps chromium
    # pyproject default addopts = "-m 'not e2e'" → must opt-in explicitly. All
    # three share the session-scoped commercial_stack (one deploy): DB-level
    # persistence + analyst (test_commercial), broker-auth chain
    # (test_broker_auth), browser login→live-SLD (test_hmi_browser).
    - uv run pytest -m e2e
      tests/e2e/test_commercial.py
      tests/e2e/test_broker_auth.py
      tests/e2e/test_hmi_browser.py
      -v --junitxml=junit-e2e.xml
  # commercial_stack is session-scoped (one stack across both tests).
  # Budget: 25 min CFN create + 10 min /health + (2 × ~5 min test work) +
  # ~10 min teardown ≈ 55 min. 90 min for AWS-flake headroom.
  timeout: 90 minutes

e2e_defense:
  # Real-AWS e2e — deploys the defense stack (Aurora + Neptune + AOSS)
  # with the industrial-fixtures DTM. Same gateway → MQTT → writer →
  # persistence chain, validated against the sovereign cloud topology.
  # Costlier than commercial (Neptune + AOSS) → manual on API triggers,
  # auto on schedule + web (human-intent pipelines).
  <<: *e2e_base
  variables:
    # File-level skipif in tests/e2e/test_defense.py looks at this env;
    # job-level variables set it for the runner shell.
    RUN_DEFENSE_E2E: "1"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
      when: manual
      allow_failure: true   # api-triggered pipelines succeed without playing defense
  script:
    # Browser parity checks (hmi_checks) drive a real Chromium.
    - uv run playwright install --with-deps chromium
    - uv run pytest -m e2e tests/e2e/test_defense.py -v --junitxml=junit-e2e.xml
  # Defense create ~30 min + health + 10 tests incl. two Chromium runs.
  timeout: 60 minutes

mirror:
  stage: mirror
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - git checkout -B main
    - git push --mirror git@github.com:arcnode-io/platform-api.git
  only:
    - main
