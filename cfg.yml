local:
  log_level: DEBUG
  host: '127.0.0.1'
  port: 8000
  e2e: false
  reload: true
  postgres_host: 'localhost'
  edp_api_url: 'http://localhost:8001'
  s3_endpoint_url: 'http://localhost:4566'
  s3_bucket: 'platform-api-artifacts'
  ses_endpoint_url: 'http://localhost:4566'
  ses_sender_email: 'noreply@arcnode.io'
  email_provider: 'ses'  # LocalStack SES; no Resend key needed locally
  site_dns: false
  platform_public_url: 'http://localhost:8000'
  dns_api_user: 'iotresister'
  dns_client_ip: '127.0.0.1'
  # CI overwrites latest.apk at this fixed key on each ems-hmi release.
  ems_hmi_apk_url: 'https://arcnode-public.s3.amazonaws.com/ems-hmi/latest.apk'
  # CI overwrites this tarball on each ems-industrial-gateway release.
  ems_industrial_gateway_tarball_url: 'https://arcnode-public.s3.amazonaws.com/gateway/ems-industrial-gateway-latest.tar.gz'
  # CI's publish_iso overwrites this on every main push.
  base_iso_url: 'https://arcnode-public.s3.amazonaws.com/iso/arcnode-ems-amd64.iso'
  cors_origins:
    - '*'  # local dev — any origin

beta:
  log_level: INFO
  host: '0.0.0.0'
  port: 8000
  e2e: true
  reload: false
  postgres_host: 'postgres'
  edp_api_url: 'http://edp-api:8000'
  s3_endpoint_url: null
  s3_bucket: 'arcnode-platform-artifacts'
  ses_endpoint_url: null
  ses_sender_email: 'noreply@arcnode.io'
  email_provider: 'resend'  # SES stays the backup until its production access is granted
  site_dns: true
  platform_public_url: 'https://platform.arcnode.io'
  dns_api_user: 'iotresister'
  dns_client_ip: '3.228.116.51'  # the platform host's Elastic IP
  # CI overwrites latest.apk at this fixed key on each ems-hmi release.
  ems_hmi_apk_url: 'https://arcnode-public.s3.amazonaws.com/ems-hmi/latest.apk'
  # CI overwrites this tarball on each ems-industrial-gateway release.
  ems_industrial_gateway_tarball_url: 'https://arcnode-public.s3.amazonaws.com/gateway/ems-industrial-gateway-latest.tar.gz'
  # CI's publish_iso overwrites this on every main push.
  base_iso_url: 'https://arcnode-public.s3.amazonaws.com/iso/arcnode-ems-amd64.iso'
  cors_origins:
    - 'https://arcnode.io'
    - 'https://www.arcnode.io'
