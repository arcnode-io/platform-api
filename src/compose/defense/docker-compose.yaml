# Defense / Sovereign variant — EMS stack on customer EC2.
#
# SMOKE-LEAN: this slice of the stack is tuned to verify the
# gateway-publish → broker → measurements-write → subscriber path. The
# analyst stack (Neptune + AOSS + analyst-server / analyst-model + their
# seed init containers) is commented out here AND in the matching CFN
# persistence build. Restore both sides together.
#
# Persistence at the moment: Aurora only — document slice (device-api
# DTM) + timeseries slice with pg_partman (EMQX-rule writes telemetry
# into `measurements`).
#
# Connection URLs sourced from /opt/arcnode/secrets.env (UserData writes
# from CFN-managed Secrets Manager).

x-env-files: &env-files
  env_file:
    - /opt/arcnode/config.env
    - /opt/arcnode/secrets.env

services:
  # ─── init containers ─────────────────────────────────────
  emqx-rule-render:
    image: python:3.13-alpine
    restart: "no"
    <<: *env-files
    environment:
      TEMPLATE_PATH: /opt/arcnode/emqx/rule.hocon.tmpl
      OUTPUT_PATH: /opt/arcnode/emqx/rule.hocon
    volumes:
      - /opt/arcnode/emqx:/opt/arcnode/emqx
      - /opt/arcnode/init-scripts:/scripts:ro
    command: ["python", "/scripts/render_emqx_rule.py"]

  # ─── long-running services ───────────────────────────────
  emqx:
    image: emqx/emqx:5.8
    restart: unless-stopped
    <<: *env-files
    environment:
      # SMOKE: anonymous + allow-all so mosquitto_sub from inside the
      # EC2 (and the gateway publishing without creds) work without
      # provisioning authn/acl rules. Production gates these at the
      # broker — restore alongside the analyst stack.
      EMQX_ALLOW_ANONYMOUS: "true"
      EMQX_AUTHORIZATION__NO_MATCH: allow
      # Default acl.conf source ships rules that deny anon on common topics.
      # Empty sources list + no_match=allow → fully permissive for the smoke.
      EMQX_AUTHORIZATION__SOURCES: "[]"
    depends_on:
      emqx-rule-render:
        condition: service_completed_successfully
    # SMOKE: rule.hocon mount intentionally dropped. EMQX 5 schema only
    # accepts http/mqtt connectors in file-based config; postgres goes
    # via the REST API. Rule registration moves to a post-boot init step.
    ports:
      # SMOKE: 1883 exposed to the host so the operator can run
      # `mosquitto_sub` against it from inside the EC2 to verify
      # gateway publishes are flowing. Internal-only by design in
      # production — drop the host port when restoring the analyst
      # stack.
      - "1883:1883"

  device-api:
    image: public.ecr.aws/y1d2j6a8/ems-device-api:latest
    restart: unless-stopped
    <<: *env-files
    environment:
      BOOT_DTM_PATH: /app/dtm.json
      # ENV=beta picks up cfg.yml's beta block (mqttBrokerUrl: mqtt://emqx:1883
      # + container-internal hostnames). Without it device-api defaults to
      # local cfg and tries to connect to 127.0.0.1:1883.
      ENV: beta
    volumes:
      - /opt/arcnode/dtm.json:/app/dtm.json:ro
    # device-api only consumes DOCUMENT_URL — vector/graph belong to the
    # analyst stack, not here. Aurora itself is up by the time compose
    # runs (CFN's ems_instance_depends_on gates the EC2 on the bootstrap
    # custom resource), so no init-container gate needed.

  # mock-modbus-server gives the gateway a fixture to poll. The DTM
  # mounted at device-api references this container by hostname. Without
  # a fixture the gateway has nothing to publish.
  mock-modbus-server:
    image: public.ecr.aws/y1d2j6a8/mock-modbus-server:latest
    restart: unless-stopped

  # SMOKE bridge between emqx + Aurora measurements. EMQX Community
  # Edition doesn't ship the Postgres connector (only http/mqtt), so this
  # tiny subscriber stands in. Replace with EMQX Enterprise's pgsql action
  # when we upgrade the license.
  telemetry-writer:
    image: python:3.13-alpine
    restart: unless-stopped
    <<: *env-files
    volumes:
      - /opt/arcnode/init-scripts:/scripts:ro
    command:
      - sh
      - -c
      - "pip install --quiet paho-mqtt psycopg2-binary && python /scripts/telemetry_writer.py"
    depends_on:
      emqx:
        condition: service_started

  industrial-gateway:
    image: public.ecr.aws/y1d2j6a8/ems-industrial-gateway:latest
    restart: unless-stopped
    <<: *env-files
    # Image's CMD is `industrial-gateway` (Dockerfile leftover from when
    # the binary was named that). cargo names it after Cargo.toml's
    # [[bin]].name → ems-industrial-gateway. Slim image PATH also drops
    # /usr/local/cargo/bin. Absolute path bypasses both. Restore the
    # CMD-only form once we re-push the gateway image with the fix.
    command: ["/usr/local/cargo/bin/ems-industrial-gateway"]
    environment:
      ENV: beta
    depends_on:
      emqx:
        condition: service_started
      device-api:
        condition: service_started
      mock-modbus-server:
        condition: service_started
