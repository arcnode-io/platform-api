# https-ingress: TLS in front of the HMI, the same file on-prem and in the cloud.
# The HMI's own nginx proxies every backend route (/api, /der-control, /mqtt
# websocket), so this only terminates TLS and forwards. The cert in
# /etc/nginx/tls is self-signed at install until a real one replaces it.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/tls/server.pem;
    ssl_certificate_key /etc/nginx/tls/server-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Docker's DNS, re-resolved at request time: a restarted hmi gets a new
    # address and a startup-resolved upstream would point at the old one.
    resolver 127.0.0.11 valid=10s;
    set $hmi http://hmi:80;

    location / {
        proxy_pass $hmi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # /mqtt is MQTT over websocket; the upgrade has to survive both proxies.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
